[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "url_indexing_playbook"
version = "0.1.0.dev0"
description = "Ping search engines about your new URLs. Django management commands for GSC + IndexNow + Cloudflare Crawler Hints."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andrew J. Pyle" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "Django>=4.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/andrewjpyle/url_indexing_playbook"
Issues = "https://github.com/andrewjpyle/url_indexing_playbook/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/url_indexing_playbook"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
